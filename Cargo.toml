[package]
name = "bhai"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
description = "An agent harness."
authors = ["Soham Zemse <soham@zemse.in>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/zemse/bhai"
homepage = "https://github.com/zemse/bhai"
keywords = ["agent", "harness", "llm", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.33", features = ["sink"] }
htmlize = { version = "1.1.0", features = ["unescape"] }
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
ignore = "0.4.31"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2.189"
lol_html = "2.9.0"
merman-ascii = "0.7.0"
merman-core = "0.7.0"
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"], optional = true }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace"], optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
rcgen = { version = "0.14.8", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "http2"] }
rmcp = { version = "2.2.0", default-features = false, features = ["auth", "client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tiktoken-rs = "0.12"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "net", "signal", "fs"] }
tokio-rustls = { version = "0.26.4", default-features = false }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
toml = "1.1.6"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-opentelemetry = { version = "0.33.0", default-features = false, optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
tui-input = "0.15.3"
unicode-width = "0.2.2"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }

[features]
# ctrl+space dictation through local recorder and whisper commands, set in `[dictation]`.
dictation = []
# OTLP/HTTP export of the trace spans, off by default for the binary's size.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# The fake backend's WebSocket endpoint.
axum = { version = "0.8.9", features = ["ws"] }
# Paused time, for the timers that fire after the cache would have lapsed.
tokio = { version = "1.53.1", features = ["test-util"] }

[[bench]]
name = "ceilings"
harness = false

[lints.rust]
# `deny` rather than `forbid`: tools/bash.rs allows its `killpg` and terminal setup one by one.
unsafe_code = "deny"

[lints.clippy]
redundant_clone = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
