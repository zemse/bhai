[package]
name = "bhai"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
description = "An agent harness."
authors = ["Soham Zemse <soham@zemse.in>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/zemse/bhai"
homepage = "https://github.com/zemse/bhai"
keywords = ["agent", "harness", "llm", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.33"
libc = "0.2.189"
merman-ascii = "0.7.0"
merman-core = "0.7.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "http2"] }
rmcp = { version = "2.2.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tiktoken-rs = "0.12"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "net"] }
toml = "1.1.6"
tui-input = "0.15.3"
unicode-width = "0.2.2"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Paused time, for the timers that fire after the cache would have lapsed.
tokio = { version = "1.53.1", features = ["test-util"] }

[[bench]]
name = "ceilings"
harness = false

[lints.rust]
# `deny` rather than `forbid`: `kill_group` in tools/bash.rs allows its one `killpg`.
unsafe_code = "deny"

[lints.clippy]
redundant_clone = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
